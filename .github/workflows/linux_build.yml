name: LinuxBuild

on:
  push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout self
        uses: actions/checkout@v4

      - name: Checkout Zed
        uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: refs/tags/v0.199.10
          path: zed

      - name: Install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: wasm32-wasip1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.backend }}-${{ hashFiles('Cargo.lock') }}
          workspaces: "zed -> target"

      - name: Build release
        working-directory: zed
        run: |
          sudo apt install -y libx11-dev libasound2-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev
          export RUSTFLAGS="-C target-cpu=native -C link-arg=-fuse-ld=lld"
          cargo b -r

      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: zed/target/release/zed

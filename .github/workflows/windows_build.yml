name: WindowsBuild

on:
  push

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        backend: [vulkan]
        include:
          - backend: vulkan
            artifact_name: zed-release
            rustflags: "-C target-feature=+avx2"
      fail-fast: false

    steps:
      - name: Enable long paths in Git
        run: |
          git config --system core.longpaths true

      - name: Enable long paths in Windows
        shell: powershell
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Install PSToml module
        shell: pwsh
        run: Install-Module -Name PSToml -Scope CurrentUser -Force

      - name: Checkout self
        uses: actions/checkout@v4

      - name: Checkout Zed
        uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: refs/tags/v0.199.10
          path: zed

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          override: true
          target: wasm32-wasip1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.backend }}-${{ hashFiles('Cargo.lock') }}
          workspaces: "zed -> target"

      - name: Setup Rustflags
        shell: pwsh
        run: ./scripts/Parse-Rustflags.ps1 ${{ matrix.rustflags }}

      - name: Build Release
        working-directory: zed
        env:
          CARGO_CFG_MSVC_SPECTRE: "0"
          ZED_UPDATE_EXPLANATION: ""
        run: cargo b -r

      - name: Archive Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: zed/target/release/zed.exe
